{% extends 'base_student.html' %}
{% block title %}Calendar{% endblock %}
{% block page_title %}Calendar & Holidays{% endblock %}
{% block breadcrumb %}Calendar{% endblock %}

{% block content %}
<!-- Calendar Card (Now Full Width) -->
<div class="calendar-card">
    <div class="calendar-header">
        <button class="nav-btn" onclick="prevMonth()">❮</button>
        <div class="month-title" id="monthTitle">Loading...</div>
        <button class="nav-btn" onclick="nextMonth()">❯</button>
    </div>
    
    <div class="weekdays">
        <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
    </div>
    
    <!-- The Grid -->
    <div class="calendar-grid" id="calendarGrid"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const holidays = {{ holidays | tojson }};
    let currentDate = new Date(); 
    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        const title = document.getElementById('monthTitle');
        grid.innerHTML = '';
        
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        
        title.textContent = `${monthNames[month]} ${year}`;

        const firstDay = new Date(year, month, 1).getDay() || 7; 
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        // Empty slots for previous month
        for (let i = 1; i < firstDay; i++) {
            grid.innerHTML += `<div class="day empty"></div>`;
        }

        // Days of the month
        for (let i = 1; i <= daysInMonth; i++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
            const holidayName = holidays[dateStr];
            
            const today = new Date();
            const isToday = (today.getDate() === i && today.getMonth() === month && today.getFullYear() === year);
            
            grid.innerHTML += `
                <div class="day ${holidayName ? 'holiday' : ''} ${isToday ? 'today' : ''}">
                    <div class="day-number">${i}</div>
                    ${holidayName ? `<div class="holiday-name">${holidayName}</div>` : ''}
                </div>`;
        }
    }

    function prevMonth() { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); }
    function nextMonth() { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); }

    renderCalendar();
</script>
{% endblock %}
